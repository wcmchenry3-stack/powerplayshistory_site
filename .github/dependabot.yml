version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Denver
    open-pull-requests-limit: 10
    target-branch: dev
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # CVE fixes get their own PR so they are never held up behind a routine batch.
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      # dependency-type already covers every package; constraining to
      # minor/patch keeps majors arriving individually, where they get read.
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types: ['minor', 'patch']
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Denver
    target-branch: dev
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
